<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能日程管理 · 我的日程</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#eef1f8;
  --text:#1c2333;
  --text-2:#5b6478;
  --text-3:#9aa3b8;
  --border:#e3e8f2;
  --primary:#6366f1;
  --primary-soft:#eef0ff;
  --shadow:0 2px 12px rgba(28,35,51,.07);
  --shadow-lg:0 12px 40px rgba(28,35,51,.16);
  --radius:14px;
  --radius-sm:10px;
  --course:#6366f1;
  --exam:#f43f5e;
  --homework:#f59e0b;
  --activity:#10b981;
  --custom:#8b5cf6;
  --danger:#ef4444;
  --ok:#16a34a;
}
html[data-theme="dark"]{
  --bg:#10131c;
  --surface:#191e2b;
  --surface-2:#222838;
  --text:#eef1fa;
  --text-2:#aab2c8;
  --text-3:#6d7690;
  --border:#2a3145;
  --primary:#818cf8;
  --primary-soft:#262c44;
  --shadow:0 2px 12px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;
  transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶部栏 ===== */
.app-header{
  position:sticky;top:0;z-index:40;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}
.header-inner{
  max-width:1500px;margin:0 auto;padding:0 20px;height:60px;
  display:flex;align-items:center;gap:18px;
}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--primary),#a78bfa);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.logo h1{font-size:17px;font-weight:700;white-space:nowrap;letter-spacing:.3px}
.logo .sub{font-size:11px;color:var(--text-3);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{
  padding:7px 14px;border-radius:9px;font-size:13.5px;color:var(--text-2);
  transition:all .18s;font-weight:500;white-space:nowrap;
}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:all .18s;flex:none;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.btn-primary{
  background:var(--primary);color:#fff;padding:9px 16px;border-radius:10px;
  font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;
  transition:all .18s;white-space:nowrap;
}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn-ghost{
  padding:8px 14px;border-radius:10px;color:var(--text-2);font-weight:500;font-size:13px;
  border:1px solid var(--border);background:var(--surface);transition:all .18s;white-space:nowrap;
}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}

/* ===== 工具条 ===== */
.toolbar{
  max-width:1500px;margin:0 auto;padding:14px 20px 4px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav .label{font-weight:600;font-size:15px;min-width:92px;text-align:center}
.nav-arrow{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);border:1px solid var(--border);background:var(--surface);transition:all .15s;
}
.nav-arrow:hover{background:var(--surface-2);color:var(--text)}
.chip{
  padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--text-2);
  border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{color:var(--primary);border-color:var(--primary)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.view-switch{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.view-switch button{
  padding:6px 14px;border-radius:8px;font-size:13px;color:var(--text-2);font-weight:500;transition:all .15s;
}
.view-switch button.active{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}

/* ===== 周视图 ===== */
.schedule-wrap{
  max-width:1500px;margin:0 auto;padding:14px 20px 40px;
}
.week-view{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
}
.grid-header{display:flex;border-bottom:1px solid var(--border);background:var(--surface-2)}
.grid-header .time-col{width:64px;flex:none}
.grid-header .day-col{flex:1;text-align:center;padding:10px 4px;border-left:1px solid var(--border)}
.day-col .dow{font-size:12.5px;color:var(--text-2);font-weight:500}
.day-col .date{font-size:16px;font-weight:700;margin-top:2px}
.day-col .date.today{color:var(--primary)}
.day-col .badge-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-left:4px;vertical-align:middle}
.grid-body{display:flex;overflow:auto;max-height:calc(100vh - 250px)}
.time-col{width:64px;flex:none;background:var(--surface-2);position:sticky;left:0;z-index:2}
.time-slot{
  height:60px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;
  font-size:11px;color:var(--text-3);border-bottom:1px solid var(--border);
}
.time-slot .num{font-weight:600;color:var(--text-2)}
.day-col{
  flex:1;position:relative;border-left:1px solid var(--border);min-width:0;
}
.day-col .empty{
  height:60px;border-bottom:1px solid var(--border);
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,var(--border) 59px,var(--border) 60px);
}
.event-block{
  position:absolute;border-radius:8px;padding:5px 7px;overflow:hidden;
  font-size:11.5px;color:#fff;cursor:pointer;transition:filter .15s,box-shadow .15s;
  box-shadow:0 1px 4px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:1px;
}
.event-block:hover{filter:brightness(1.1);z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.event-block.dragging{opacity:.7;transform:scale(.98)}
.event-block .ev-title{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-block .ev-loc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9;font-size:10.5px}
.event-block .ev-time{opacity:.85;font-size:10px}
.event-block.t-all-day{height:auto !important;min-height:22px}
.event-block.t-muted{background:rgba(99,102,241,.18);color:var(--text);border:1px dashed var(--primary);box-shadow:none}

/* 冲突并排 */
.day-col{overflow:hidden}
.day-col .slot-wrap{position:absolute;top:0;bottom:0}

/* 倒计时 */
.countdown-banner{
  max-width:1500px;margin:12px auto 0;padding:0 20px;
}
.cd-strip{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
}
.cd-card{
  flex:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;display:flex;align-items:center;gap:10px;min-width:200px;box-shadow:var(--shadow);
}
.cd-card .cd-type{width:8px;height:32px;border-radius:4px;flex:none}
.cd-card .cd-title{font-weight:600;font-size:13px}
.cd-card .cd-num{font-weight:800;font-size:18px;color:var(--primary)}
.cd-card .cd-num.warn{color:var(--danger)}
.cd-card .cd-label{font-size:11px;color:var(--text-3)}
.cd-empty{color:var(--text-3);font-size:13px;padding:6px 2px}

/* ===== 日视图 ===== */
.day-view{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.day-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.day-header h2{font-size:16px;font-weight:700}
.day-body{display:flex;max-height:calc(100vh - 260px);overflow:auto}
.day-body .time-col{width:64px;flex:none;background:var(--surface-2);position:sticky;left:0;z-index:2}
.day-slot{flex:1;position:relative;min-height:720px}

/* ===== 月视图 ===== */
.month-view{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.month-cell-head{padding:9px;text-align:center;font-size:12.5px;color:var(--text-2);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--border)}
.month-cell{min-height:108px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;position:relative}
.month-cell:nth-child(7n){border-right:none}
.month-cell .md{font-size:12.5px;color:var(--text-2);font-weight:500}
.month-cell .md.today{background:var(--primary);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.month-cell .md.other{color:var(--text-3);opacity:.5}
.month-cell .m-event{
  font-size:10.5px;padding:2px 5px;border-radius:5px;color:#fff;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.month-cell .m-more{font-size:10.5px;color:var(--text-3);padding:2px 5px}

/* ===== 今日概览 ===== */
.today-view{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .p-ic{color:var(--primary)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface-2);border-radius:12px;padding:14px;text-align:center}
.stat-card .s-num{font-size:22px;font-weight:800;color:var(--primary)}
.stat-card .s-label{font-size:11.5px;color:var(--text-2);margin-top:2px}
.list-events{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.list-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);transition:all .15s;cursor:pointer;
}
.list-item:hover{background:var(--surface-2)}
.list-item .li-bar{width:4px;height:36px;border-radius:3px;flex:none}
.list-item .li-title{font-weight:600;font-size:13.5px}
.list-item .li-meta{font-size:12px;color:var(--text-2)}
.list-item .li-right{margin-left:auto;text-align:right}
.term-progress{margin-top:4px}
.prog-bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.prog-bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),#a78bfa);transition:width .4s}

/* ===== 待办 ===== */
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);
}
.todo-item .td-ck{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:#fff;
}
.todo-item .td-ck.done{background:var(--ok);border-color:var(--ok)}
.todo-item.done .td-title{text-decoration:line-through;color:var(--text-3)}
.todo-item .td-title{font-weight:600;font-size:13.5px;flex:1}
.todo-item .td-due{font-size:12px;color:var(--text-2);white-space:nowrap}
.todo-item .td-due.warn{color:var(--danger);font-weight:600}
.todo-item .td-rm{color:var(--text-3);font-size:12px;cursor:pointer;padding:4px}
.todo-item .td-rm:hover{color:var(--danger)}

/* ===== 弹窗 ===== */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,18,30,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);
  width:560px;max-width:100%;max-height:88vh;overflow:auto;animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{font-size:16px;font-weight:700;flex:1}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{
  padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);
  outline:none;transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:56px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.type-picker{display:flex;gap:8px;flex-wrap:wrap}
.type-pill{
  padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);color:var(--text-2);transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.type-pill .pill-dot{width:8px;height:8px;border-radius:50%}
.type-pill.active{color:#fff;border-color:transparent}
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative}
.color-dot.active{border-color:var(--text);transform:scale(1.12)}
.color-dot.active::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
.slot-card{
  border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:10px;
}
.slot-card .sc-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--primary)}
.slot-card .sc-rm{margin-left:auto;color:var(--text-3);cursor:pointer;padding:2px 6px;font-size:12px}
.slot-card .sc-rm:hover{color:var(--danger)}
.add-slot-btn{
  border:1px dashed var(--primary);color:var(--primary);padding:9px;border-radius:9px;
  font-size:13px;font-weight:600;transition:all .15s;background:var(--primary-soft);
}
.add-slot-btn:hover{background:var(--primary);color:#fff}
.switch-line{display:flex;align-items:center;justify-content:space-between;padding:6px 2px}
.switch-line .sw-label{font-size:13px;font-weight:500}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{
  position:absolute;inset:0;background:var(--border);border-radius:24px;cursor:pointer;transition:background .2s;
}
.switch .slider::before{
  content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider::before{transform:translateX(18px)}

/* ===== AI 助手 ===== */
.ai-fab{
  position:fixed;right:24px;bottom:24px;z-index:60;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),#a78bfa);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(99,102,241,.45);transition:all .2s;
}
.ai-fab:hover{transform:scale(1.08)}
.ai-fab .pulse{position:absolute;inset:0;border-radius:50%;background:var(--primary);opacity:.35;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.4}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.ai-panel{
  position:fixed;right:24px;bottom:92px;z-index:60;width:380px;max-width:calc(100vw - 32px);
  background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;max-height:78vh;animation:slideUp .22s ease;
}
.ai-head{padding:14px 18px;background:linear-gradient(135deg,var(--primary),#a78bfa);color:#fff;display:flex;align-items:center;gap:10px}
.ai-head .ai-title{font-weight:700;font-size:14.5px;flex:1}
.ai-close{color:rgba(255,255,255,.85);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.ai-close:hover{background:rgba(255,255,255,.2)}
.ai-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:52vh}
.ai-msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.55;white-space:pre-wrap}
.ai-msg.bot{background:var(--surface-2);border-bottom-left-radius:4px;align-self:flex-start}
.ai-msg.user{background:var(--primary);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.ai-msg .ai-cmd{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.4);font-size:12px;opacity:.9}
.ai-msg.bot .ai-cmd{border-top-color:var(--border)}
.ai-tip{font-size:11.5px;color:var(--text-3);padding:0 4px}
.ai-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.ai-input input{
  flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);outline:none;
}
.ai-input input:focus{border-color:var(--primary)}
.ai-send{width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:all .15s}
.ai-send:hover{filter:brightness(1.1)}
.ai-loading{display:flex;gap:4px;padding:10px 14px}
.ai-loading i{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:bounce .8s infinite}
.ai-loading i:nth-child(2){animation-delay:.15s}
.ai-loading i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}

/* ===== 提示 ===== */
.toast{
  position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--surface);color:var(--text);padding:11px 20px;border-radius:12px;
  box-shadow:var(--shadow-lg);z-index:200;font-size:13.5px;font-weight:500;
  opacity:0;transition:all .3s;border:1px solid var(--border);display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .t-ic{color:var(--ok)}
.toast.error .t-ic{color:var(--danger)}

/* 空态 */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--text-3);gap:12px;text-align:center;
}
.empty-state .es-ic{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.empty-state h3{font-size:15px;color:var(--text-2);font-weight:600}
.empty-state p{font-size:13px;max-width:360px}

@media (max-width:900px){

const $$ = s => Array.from(document.querySelectorAll(s));

const TYPE_META = {

const WEEK_CN = ["周一","周二","周三","周四","周五","周六","周日"];
const DEFAULT_PERIODS = [
  {start:"08:00",end:"08:45"},{start:"08:55",end:"09:40"},{start:"10:00",end:"10:45"},
  {start:"10:55",end:"11:40"},{start:"14:00",end:"14:45"},{start:"14:55",end:"15:40"},

const COLOR_OPTIONS = ["#6366f1","#f43f5e","#f59e0b","#10b981","#8b5cf6","#06b6d4","#ec4899","#f97316","#64748b","#84cc16"];

const STORE_KEY = "smart-schedule-v1";

/* ===== 默认数据 ===== */
function defaultSettings(){

    termStart: "2026-09-07", // 周一

    theme: "light",
    periods: DEFAULT_PERIODS.map(p=>({...p})),
    apiMode: "local", // local | api

/* 常用大模型 API 服务商预设（均兼容 OpenAI 格式 /chat/completions） */
const AI_PROVIDERS = {
  volcengine:{ name:"豆包 / 火山方舟", endpoint:"https://ark.cn-beijing.volces.com/api/v3/chat/completions", model:"doubao-seed-1-6-250615", auth:"bearer", note:"在火山方舟控制台创建推理接入点，把接入点 ID 填到模型栏" },

  deepseek:{ name:"DeepSeek", endpoint:"https://api.deepseek.com/chat/completions", model:"deepseek-chat", auth:"bearer", note:"DeepSeek 官方接口，模型可选 deepseek-chat / deepseek-reasoner" },
  moonshot:{ name:"Kimi / Moonshot", endpoint:"https://api.moonshot.cn/v1/chat/completions", model:"moonshot-v1-8k", auth:"bearer", note:"月之暗面 Kimi 开放平台" },
  zhipu:{ name:"智谱 GLM", endpoint:"https://open.bigmodel.cn/api/paas/v4/chat/completions", model:"glm-4-flash", auth:"bearer", note:"智谱开放平台，GLM-4-Flash 有免费额度" },
  qwen:{ name:"通义千问", endpoint:"https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", model:"qwen-plus", auth:"bearer", note:"阿里云百炼兼容模式，模型可选 qwen-turbo / qwen-plus" },

};
function seedEvents(){

    ]),

      {weekday:2,startPeriod:1,endPeriod:2,startWeek:1,endWeek:16,parity:"odd",location:"B305"}
    ]),
    c("e3","大学英语（2）","course","#ec4899",[
      {weekday:1,startPeriod:3,endPeriod:4,startWeek:1,endWeek:16,parity:"all",location:"外语楼201"}
    ]),
    c("e4","数据结构","course","#8b5cf6",[
      {weekday:4,startPeriod:3,endPeriod:4,startWeek:1,endWeek:16,parity:"all",location:"计算机CD201"},
      {weekday:5,startPeriod:5,endPeriod:6,startWeek:1,endWeek:8,parity:"all",location:"实验楼402"}
    ]),
    c("e5","计算机网络","course","#f97316",[
      {weekday:4,startPeriod:5,endPeriod:6,startWeek:1,endWeek:16,parity:"all",location:"计算机CD201"}
    ]),
    c("e6","大学物理","course","#10b981",[
      {weekday:2,startPeriod:5,endPeriod:6,startWeek:1,endWeek:16,parity:"even",location:"A305"},
      {weekday:5,startPeriod:1,endPeriod:2,startWeek:1,endWeek:16,parity:"all",location:"A305"}
    ]),
    c("e7","线性代数期中考试","exam","#f43f5e",[],{date:"2026-10-15",startTime:"09:00",endTime:"11:00",location:"B305",deadline:"2026-10-15",todo:true}),
    c("e8","数据结构实验报告","homework","#f59e0b",[],{date:null,deadline:"2026-09-20",dueTime:"23:59",todo:true}),
    c("e9","大学英语听说作业","homework","#f59e0b",[],{date:null,deadline:"2026-09-18",dueTime:"23:59",todo:true}),
    c("e10","社团招新摆摊","activity","#10b981",[],{date:fmtDate(addDays(today(),3)),startTime:"12:00",endTime:"18:00",location:"食堂门口",allDay:false}),
    c("e11","健身","custom","#64748b",[
      {weekday:3,startPeriod:9,endPeriod:10,startWeek:1,endWeek:20,parity:"all",location:"健身房"}
    ])
  ];
}
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* ===== 存储 ===== */
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      return {
        settings: Object.assign(defaultSettings(), d.settings||{}),
        events: d.events||[]
      };
    }
  }catch(e){}
  return { settings: defaultSettings(), events: seedEvents() };
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify({settings:state.settings, events:state.events}));
}
function uid(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ===== 日期工具 ===== */
function parseDate(s){
  if(!s || typeof s !== "string") return today();
  const parts = s.split("-").map(Number);
  if(parts.length!==3 || parts.some(isNaN)) return today();
  return new Date(parts[0],parts[1]-1,parts[2]);
}
function fmtDate(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; }
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function weekIndexOf(dateStr){
  const start = mondayOf(parseDate(state.settings.termStart));
  const target = mondayOf(parseDate(dateStr));
  return Math.floor((target-start)/86400000/7)+1;
}
function weekStartDate(weekIdx){
  const start = mondayOf(parseDate(state.settings.termStart));
  return addDays(start,(weekIdx-1)*7);
}
function curWeekIndex(){
  return Math.max(1, Math.min(state.settings.totalWeeks, weekIndexOf(fmtDate(today()))));
}
function dateOfWeekDay(weekIdx, weekday){ // weekday 0-6 (周一=0)
  return addDays(weekStartDate(weekIdx), weekday);
}
function daysUntil(dateStr){
  const t = parseDate(dateStr).getTime();
  const n = today().getTime();
  return Math.round((t-n)/86400000);
}
function isWithinWeek(ev, weekIdx){
  if(!ev.slots || !ev.slots.length) return false;
  return ev.slots.some(s => s.startWeek<=weekIdx && s.endWeek>=weekIdx &&
    (s.parity==="all" || (s.parity==="odd" && weekIdx%2===1) || (s.parity==="even" && weekIdx%2===0)));
}
function weekParity(weekIdx){ return weekIdx%2===1 ? "odd" : "even"; }

/* ===== 视图状态 ===== */
const viewState = {
  currentView: "week",
  weekIdx: curWeekIndex(),
  filter: "all",
  dayDate: fmtDate(today())
};

/* ===== 渲染主入口 ===== */
function render(){
  renderTabs();
  renderToolbar();
  const area = $("#mainArea");
  if(viewState.currentView==="week") renderWeekView(area);
  else if(viewState.currentView==="day") renderDayView(area);
  else if(viewState.currentView==="month") renderMonthView(area);
  else if(viewState.currentView==="today") renderTodayView(area);
  else if(viewState.currentView==="todo") renderTodoView(area);
  else if(viewState.currentView==="settings") renderSettingsView(area);
}

/* ===== 顶部标签 ===== */
function renderTabs(){
  $$("#mainTabs .tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.nav===viewState.currentView);
  });
}

/* ===== 工具条 ===== */
function renderToolbar(){
  const toolbar = $("#weekToolbar");
  toolbar.style.display = ["week","day","month"].includes(viewState.currentView) ? "flex" : "none";
  if(!toolbar.style.display || toolbar.style.display==="none") return;
  $("#weekLabel").textContent = `第 ${viewState.weekIdx} 周`;
  $$("#viewSwitch button").forEach(b=>b.classList.toggle("active", b.dataset.vw===viewState.currentView));
  const free = calcFreeHours(viewState.weekIdx);
  $("#freeTimeChip").textContent = `本周空闲 ${free}h`;
  $$("#typeFilter .chip").forEach(c=>c.classList.toggle("on", c.dataset.filter===viewState.filter));
}

/* ===== 空闲时间计算 ===== */
function calcFreeHours(weekIdx){
  const periods = state.settings.periods;
  const total = periods.length * 5; // 周一到周五
  let used = 0;
  state.events.forEach(ev=>{
    if(ev.type==="exam"||ev.type==="activity") return;
    if(!ev.slots||!ev.slots.length) return;
    ev.slots.forEach(s=>{
      if(s.startWeek>weekIdx||s.endWeek<weekIdx) return;
      const p = s.parity;
      if(p!=="all" && p!==weekParity(weekIdx)) return;
      const span = s.endPeriod-s.startPeriod+1;
      used += span;
    });
  });
  return Math.max(0, total-used);
}

/* ===== 事件块（周/日视图通用）===== */
function buildBlocks(weekIdx, filter){
  const blocks = [];
  const per = state.settings.periods.length;
  state.events.forEach(ev=>{
    if(filter!=="all" && ev.type!==filter) return;
    // 周期性事件
    if(ev.slots && ev.slots.length){
      ev.slots.forEach(s=>{
        if(s.startWeek>weekIdx||s.endWeek<weekIdx) return;
        if(s.parity!=="all" && s.parity!==weekParity(weekIdx)) return;
        blocks.push({
          id:ev.id, type:ev.type, title:ev.title, color:ev.color, location:s.location||ev.note||"",
          weekday:s.weekday-1, startPeriod:s.startPeriod, endPeriod:s.endPeriod,
          start:per[s.startPeriod-1]?.start||"", end:per[s.endPeriod-1]?.end||"",
          weeks:`${s.startWeek}-${s.endWeek}周${s.parity==="odd"?"单":s.parity==="even"?"双":""}`,
          allDay:false, muted:false
        });
      });
    }
    // 一次性事件（考试/活动/自定义）
    if(ev.date){
      const di = daysUntil(ev.date);
      const wk = weekIndexOf(ev.date);
      if(wk===weekIdx){
        const wd = (parseDate(ev.date).getDay()+6)%7;
        let startP=1,endP=1;
        if(ev.startTime && ev.endTime){
          startP = periodOfTime(ev.startTime)||1;
          endP = periodOfTime(ev.endTime)||Math.max(startP, Math.min(per, startP+2));
        }
        blocks.push({
          id:ev.id, type:ev.type, title:ev.title, color:ev.color, location:ev.location||"",
          weekday:wd, startPeriod:startP, endPeriod:endP,
          start:ev.startTime||"", end:ev.endTime||"", weeks:fmtDate(ev.date),
          allDay:ev.allDay||false, muted:di<0
        });
      }
    }
  });
  return blocks;
}
function periodOfTime(t){
  if(!t) return 1;
  const hm = t.split(":").map(Number);
  const mins = hm[0]*60+hm[1];
  const per = state.settings.periods;
  for(let i=0;i<per.length;i++){
    const s = per[i].start.split(":").map(Number);
    if((s[0]*60+s[1])<=mins) { /* keep looking for the closest start */ }
    if((s[0]*60+s[1])<=mins && (i===per.length-1 || (per[i+1].start.split(":").map(Number)[0]*60+per[i+1].start.split(":").map(Number)[1])>mins)) return i+1;
  }
  return 1;
}

/* 布局：把重叠事件分列 */
function layoutBlocks(blocks, per){
  // 按 weekday 分组
  const groups = {};
  blocks.forEach(b=>{
    (groups[b.weekday]=groups[b.weekday]||[]).push(b);
  });
  const out = {};
  Object.keys(groups).forEach(wd=>{
    const arr = groups[wd].sort((a,b)=>a.startPeriod-b.startPeriod);
    const lanes=[];
    arr.forEach(b=>{
      let placed=false;
      for(let li=0;li<lanes.length;li++){
        const last = lanes[li][lanes[li].length-1];
        if(b.startPeriod>last.endPeriod){ lanes[li].push(b); placed=true; break; }
      }
      if(!placed){ lanes.push([b]); }
    });
    lanes.forEach((lane,li)=>{
      lane.forEach(b=>{ b.lane=li; b.laneCount=lanes.length; });
    });
    out[wd]=arr;
  });
  return out;
}

/* ===== 周视图 ===== */
function renderWeekView(area){
  const weekIdx = viewState.weekIdx;
  const per = state.settings.periods;
  const blocks = buildBlocks(weekIdx, viewState.filter);
  const grouped = layoutBlocks(blocks, per);
  const wStart = weekStartDate(weekIdx);
  const todayStr = fmtDate(today());

  let html = '';
  // 倒计时条
  html += renderCountdownStrip();
  // 表头
  html += `<div class="week-view">
    <div class="grid-header">
      <div class="time-col"></div>`;
  for(let wd=0;wd<7;wd++){
    const d = dateOfWeekDay(weekIdx, wd);
    const ds = fmtDate(d);
    const isToday = ds===todayStr;
    const cnt = (grouped[wd]||[]).filter(b=>!b.muted).length;

      <div class="dow">${WEEK_CN[wd]}</div>

    html += `<div class="time-slot"><span><span class="num">${i+1}</span><br>${per[i].start}</span></div>`;
  }
  html += `</div>`;
  for(let wd=0;wd<7;wd++){

      for(let i=0;i<per.length;i++) html += `<div class="empty"></div>`;

        const top=(b.startPeriod-1)*60;
        const h=(b.endPeriod-b.startPeriod+1)*60-3;

          data-type="${b.type}" style="top:${top}px;height:${h}px;left:${left}%;width:${width}%;
          background:${b.color}${b.muted?"bb":""}">
          <span class="ev-title">${escapeHtml(b.title)}</span>
          ${b.location?`<span class="ev-loc">${escapeHtml(b.location)}</span>`:""}
          <span class="ev-time">${b.start?`${b.start}${b.end?"-"+b.end:""}`:""}${b.weeks?` · ${b.weeks}`:""}</span>
        </div>`;

    html += `</div>`;
  }
  html += `</div></div>`;

  // 空态
  if(!blocks.length){
    html += `<div class="empty-state" style="margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px">
      <div class="es-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>

      <p>点击右上角「添加日程」，或用右下角 AI 助手说句话就能安排课程和事件。</p>
    </div>`;

  area.innerHTML = html;
  bindEventBlocks(area);
}

/* ===== 倒计时条 ===== */
function renderCountdownStrip(){
  const now = fmtDate(today());
  const cds = [];
  state.events.forEach(ev=>{
    if(ev.type==="exam" && ev.date){
      cds.push({type:"exam", title:ev.title, date:ev.date, color:ev.color, d:daysUntil(ev.date)});
    }
    if(ev.type==="homework" && ev.deadline){
      cds.push({type:"homework", title:ev.title, date:ev.deadline, color:ev.color, d:daysUntil(ev.deadline)});
    }
    if(ev.type==="activity" && ev.date && ev.daysUntilShow!==false){
      cds.push({type:"activity", title:ev.title, date:ev.date, color:ev.color, d:daysUntil(ev.date)});
    }
  });
  cds.sort((a,b)=>a.d-b.d);
  cds.length = Math.min(cds.length, 6);
  if(!cds.length) return `<div class="countdown-banner"><div class="cd-empty">暂无倒计时日程</div></div>`;
  let html = `<div class="countdown-banner"><div class="cd-strip">`;
  cds.forEach(c=>{
    const urgent = c.d<=3;
    const label = c.d===0 ? "就在今天" : c.d<0 ? `已过期 ${-c.d} 天` : c.d===1 ? "还剩 1 天" : `还剩 ${c.d} 天`;
    html += `<div class="cd-card">
      <div class="cd-type" style="background:${c.color}"></div>
      <div style="flex:1;min-width:0">
        <div class="cd-title">${escapeHtml(c.title)}</div>
        <div class="cd-label">${TYPE_META[c.type].name} · ${c.date}</div>
      </div>
      <div style="text-align:right">
        <div class="cd-num ${urgent?"warn":""}">${c.d<0?-c.d:c.d}</div>
        <div class="cd-label">${c.d<0?"天前":"天"}</div>
      </div>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

/* ===== 月视图 ===== */
function renderMonthView(area){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayStr = fmtDate(today());
  const weekIdx = viewState.weekIdx;
  const blocks = buildBlocks(weekIdx, "all");

  let html = `<div class="month-view"><div class="month-grid">`;
  for(let i=0;i<7;i++) html += `<div class="month-cell-head">${WEEK_CN[i]}</div>`;
  for(let i=0;i<startOffset;i++) html += `<div class="month-cell"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const ds = fmtDate(new Date(y,m,day));
    const wd = (new Date(y,m,day).getDay()+6)%7;
    const isToday = ds===todayStr;
    const dayEvs = [];
    state.events.forEach(ev=>{
      if(ev.date===ds){
        dayEvs.push({id:ev.id,title:ev.title,color:ev.color,type:ev.type});
      } else if(ev.slots&&ev.slots.length){
        ev.slots.forEach(s=>{
          if(s.weekday-1===wd && s.startWeek<=weekIdx && s.endWeek>=weekIdx &&
             (s.parity==="all"||s.parity===weekParity(weekIdx))){
            if(!dayEvs.some(x=>x.id===ev.id)) dayEvs.push({id:ev.id,title:ev.title,color:ev.color,type:ev.type});
          }
        });
      }
    });
    html += `<div class="month-cell" data-date="${ds}">
      <span class="md ${isToday?"today":""}">${day}</span>`;
    dayEvs.slice(0,3).forEach(ev=>{
      html += `<div class="m-event" data-id="${ev.id}" style="background:${ev.color}">${escapeHtml(ev.title)}</div>`;
    });
    if(dayEvs.length>3) html += `<div class="m-more">+${dayEvs.length-3} 更多</div>`;
    html += `</div>`;
  }
  html += `</div></div>`;
  area.innerHTML = html;
  area.querySelectorAll(".m-event").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openEventModal(el.dataset.id); };
  });
  area.querySelectorAll(".month-cell").forEach(cell=>{
    cell.addEventListener("dblclick", ()=>{ prefillDate(cell.dataset.date); });
  });
}

/* ===== 待办 ===== */
function renderTodoView(area){
  const todos = state.events.filter(e=>e.todo);
  const sorted = todos.slice().sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    const da = a.deadline||a.date||"9999";
    const db = b.deadline||b.date||"9999";
    return da.localeCompare(db);
  });
  let html = `<div class="panel" style="max-width:900px;margin:0 auto">
    <h3><span class="p-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>待办事项</h3>
    <div class="todo-list" id="todoList">`;
  if(!sorted.length){
    html += `<div class="empty-state" style="padding:40px"><div class="es-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></div><h3>没有待办</h3><p>把考试、作业设为待办后会出现在这里，还能看到倒计时。</p></div>`;
  } else {
    html += sorted.map(t=>{
      const due = t.deadline||t.date;
      const d = due?daysUntil(due):null;
      const dueLabel = !due ? "" : d===0?"今天截止":d<0?`已过 ${-d} 天`:`${d} 天后`;
      const warn = d!==null && d<=3 && !t.done;
      return `<div class="todo-item ${t.done?"done":""}" data-id="${t.id}">
        <div class="td-ck ${t.done?"done":""}" data-done="${t.id}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
        <div class="li-bar" style="background:${t.color};width:4px;height:36px;border-radius:3px;flex:none"></div>
        <span class="td-title">${escapeHtml(t.title)}</span>
        <span class="td-due ${warn?"warn":""}">${TYPE_META[t.type].name}${due?` · ${due}${dueLabel?" · "+dueLabel:""}`:""}</span>
        <span class="td-rm" data-rm="${t.id}">删除</span>
      </div>`;
    }).join("");
  }
  html += `</div></div>`;
  area.innerHTML = html;
  area.querySelectorAll("[data-done]").forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const ev = state.events.find(x=>x.id===el.dataset.done);
    if(ev){ ev.done=!ev.done; save(); render(); }
  });
  area.querySelectorAll("[data-rm]").forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const id = el.dataset.rm;
    if(confirm("确定删除该待办日程吗？")){
      state.events = state.events.filter(x=>x.id!==id); save(); render(); toast("已删除待办");
    }
  });
  area.querySelectorAll(".todo-item").forEach(el=>el.onclick=()=>openEventModal(el.dataset.id));
}

    </div>
  </div>`;
  area.innerHTML = html;

  $("#addPeriodBtn").onclick = ()=>{
    state.settings.periods.push({start:"09:00",end:"09:45"}); renderPeriodEditor();
  };
  // 服务商预设切换：自动填充 endpoint / model / auth / 提示
  const syncProviderUI = ()=>{
    const p = AI_PROVIDERS[$("#setProvider").value] || AI_PROVIDERS.custom;
    $("#setEndpoint").value = p.endpoint;
    $("#setModel").value = p.model;
    $("#setAuth").value = p.auth;
    $("#providerNote").textContent = p.note || "";
  };
  $("#setProvider").onchange = syncProviderUI;
  $("#setProvider").oninput = syncProviderUI;
  // 初始化提示
  const initP = AI_PROVIDERS[state.settings.aiProvider] || AI_PROVIDERS.custom;
  $("#providerNote").textContent = initP.note || "";
  // 测试连接
  $("#testApiBtn").onclick = async ()=>{
    const ep = $("#setEndpoint").value.trim();
    const key = $("#setApiKey").value.trim();
    const model = $("#setModel").value.trim();
    const auth = $("#setAuth").value;
    const res = $("#testApiResult");
    if(!ep){ res.textContent = "请先填写 API 地址"; res.style.color="#f43f5e"; return; }
    if(auth!=="none" && !key){ res.textContent = "请先填写 API Key"; res.style.color="#f43f5e"; return; }
    res.textContent = "测试中…"; res.style.color="var(--text-3)";
    try{
      const headers = {"Content-Type":"application/json"};
      if(auth==="bearer") headers["Authorization"]="Bearer "+key;
      else if(auth==="api-key") headers["api-key"]=key;
      const resp = await fetch(ep, {
        method:"POST",
        headers,
        body: JSON.stringify({model, messages:[{role:"user",content:"你好，请只回复：连接成功"}]})
      });
      if(!resp.ok){
        const t = await resp.text();
        let msg = `连接失败（HTTP ${resp.status}）`;
        if(resp.status===401) msg = "连接失败：API Key 无效或已过期（HTTP 401）——请到服务商平台重新复制 API Key，注意不要多复制空格或换行";
        else if(resp.status===402) msg = "连接失败：账户余额不足（HTTP 402）——请到服务商平台充值";
        else if(resp.status===403) msg = "连接失败：没有访问权限（HTTP 403）——请检查 Key 是否被禁用或权限";
        else if(resp.status===404) msg = "连接失败：API 地址或模型名不存在（HTTP 404）——请检查地址/模型是否正确";
        else if(resp.status===429) msg = "连接失败：请求过于频繁（HTTP 429）——请稍后再试";
        else if(resp.status>=500) msg = "连接失败：服务商服务器错误（HTTP "+resp.status+"）——请稍后重试";
        res.textContent = msg;
        res.style.color="#f43f5e";
        return;
      }
      const data = await resp.json();
      const content = data.choices?.[0]?.message?.content || "";
      res.textContent = content ? "连接成功 ✓" : "连接成功（无回答）";
      res.style.color="#10b981";
    }catch(e){
      res.textContent = "连接失败："+e.message;
      res.style.color="#f43f5e";
    }
  };
  $("#saveSettingsBtn").onclick = ()=>{
    state.settings.termStart = $("#setTermStart").value;
    state.settings.totalWeeks = Math.max(1, Number($("#setTotalWeeks").value)||20);
    state.settings.theme = $("#setTheme").checked ? "dark":"light";
    state.settings.apiMode = $("#setApiMode").checked ? "api":"local";
    state.settings.aiProvider = $("#setProvider").value;
    state.settings.aiEndpoint = $("#setEndpoint").value.trim();
    state.settings.aiKey = $("#setApiKey").value.trim();
    state.settings.aiModel = $("#setModel").value.trim();
    state.settings.aiAuth = $("#setAuth").value;
    applyTheme();
    save(); render(); toast("设置已保存");
  };
  $("#resetDataBtn").onclick = ()=>{
    if(confirm("将清空当前所有日程并恢复示例数据，确定吗？")){
      state.events = seedEvents();
      save(); render(); toast("已恢复示例数据");
    }
  };
}

/* ===== 事件块交互（点击 / 拖拽调课）===== */
function bindEventBlocks(area){
  area.querySelectorAll(".event-block").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openEventModal(el.dataset.id); };
    // 拖拽调课
    el.setAttribute("draggable","true");
    el.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain", JSON.stringify({id:el.dataset.id}));
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); });
  });
  // 放置目标：day-col
  area.querySelectorAll(".day-col[data-wd]").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); col.style.outline="2px solid var(--primary)"; });
    col.addEventListener("dragleave", ()=>{ col.style.outline=""; });
    col.addEventListener("drop", e=>{
      e.preventDefault(); col.style.outline="";
      let data;
      try{ data = JSON.parse(e.dataTransfer.getData("text/plain")); }catch(err){ return; }
      const newWd = Number(col.dataset.wd)+1;
      const ev = state.events.find(x=>x.id===data.id);
      if(!ev) return;
      // 根据拖放位置估算节次
      const rect = col.getBoundingClientRect();
      const y = e.clientY-rect.top;
      const period = Math.min(state.settings.periods.length, Math.max(1, Math.floor(y/60)+1));
      if(ev.slots && ev.slots.length){
        // 调整第一个时段
        ev.slots[0].weekday = newWd;
        const span = ev.slots[0].endPeriod - ev.slots[0].startPeriod;
        ev.slots[0].startPeriod = period;
        ev.slots[0].endPeriod = Math.min(state.settings.periods.length, period+span);
        if(newWd===ev.slots[0].weekday) toast(`已调课到${WEEK_CN[newWd-1]} 第${period}节`);
      } else if(ev.date){
        // 一次性事件：改日期
        const newDate = dateOfWeekDay(viewState.weekIdx, newWd-1);
        ev.date = fmtDate(newDate);
        toast(`已改期到 ${ev.date}`);
      }
      save(); render();
    });
  });
}

  // 类型选择

    typePicker.insertAdjacentHTML("beforeend",
      `<button class="type-pill ${(ev?ev.type:"course")===t?"active":""}" data-t="${t}" style="${(ev?ev.type:"course")===t?`background:${meta.color}`:""}">

  });
  let curType = ev?ev.type:"course";
  typePicker.querySelectorAll(".type-pill").forEach(p=>{
    p.onclick = ()=>{
      curType = p.dataset.t;
      typePicker.querySelectorAll(".type-pill").forEach(x=>{
        x.classList.toggle("active", x===p);
        x.style.background = x===p ? TYPE_META[curType].color : "";
        x.style.color = x===p ? "#fff" : "";
      });
      renderScheduleEditor(curType, ev);
    };
  });

  // 颜色选择
  const colorPicker = $("#colorPicker");
  const curColor = ev?ev.color:TYPE_META.course.color;

    colorPicker.insertAdjacentHTML("beforeend",
      `<div class="color-dot ${c===curColor?"active":""}" data-c="${c}" style="background:${c}"></div>`);

  colorPicker.querySelectorAll(".color-dot").forEach(d=>{

function collectSlots(){
  const box = $("#scheduleEditor"); if(!box) return null;
  const curType = getCurType();
  if(curType==="course"){
    const slots=[];
    box.querySelectorAll(".slot-card").forEach(card=>{
      const get = f=>card.querySelector(`[data-sf="${f}"]`);
      const weekday = Number(get("weekday").value);
      const startPeriod = Number(get("startPeriod").value);
      const endPeriod = Number(get("endPeriod").value);
      const startWeek = Number(get("startWeek").value);
      const endWeek = Number(get("endWeek").value);
      const parity = get("parity").value;
      const location = get("location").value.trim();
      if(!weekday) return;
      slots.push({weekday,startPeriod,endPeriod,startWeek,endWeek,parity,location});
    });
    return slots;
  } else {
    const slot={weekday:1,startPeriod:1,endPeriod:2,startWeek:1,endWeek:1,parity:"all",location:""};
    const get = f=>box.querySelector(`[data-f="${f}"]`);
    if(curType==="homework"){
      slot.date = null;
      slot.deadline = get("deadline")?get("deadline").value:"";
      slot.dueTime = get("dueTime")?get("dueTime").value:"";
      slot.startTime=null; slot.endTime=null; slot.allDay=false;
    } else if(curType==="activity" || curType==="custom"){
      slot.date = get("date")?get("date").value:"";
      slot.startTime = get("startTime")?get("startTime").value:"";
      slot.endTime = get("endTime")?get("endTime").value:"";
      slot.allDay = get("allDay")?get("allDay").checked:false;
      slot.deadline=null; slot.dueTime=null;
    } else {
      slot.date = get("date")?get("date").value:"";
      slot.startTime = get("startTime")?get("startTime").value:"";
      slot.endTime = get("endTime")?get("endTime").value:"";
      slot.deadline=null; slot.dueTime=null;
    }
    return [slot];
  }
}
function getCurType(){
  const active = $("#typePicker .type-pill.active");
  return active?active.dataset.t:"course";
}
function closeModal(){
  $("#modalRoot").innerHTML="";
}

/* ===== 导入导出 ===== */
function exportJSON(){
  const data = {exportedAt:fmtDate(today()), app:"智能日程管理", settings:state.settings, events:state.events};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `日程管理_${fmtDate(today())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 JSON");
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(data.events && Array.isArray(data.events)){
        state.events = data.events;
        if(data.settings) state.settings = Object.assign(state.settings, data.settings);
        save(); render();
        toast(`导入成功，共 ${data.events.length} 条日程`);
      } else {
        toast("文件格式不正确","error");
      }
    }catch(e){ toast("JSON 解析失败","error"); }
  };
  reader.readAsText(file);
}

/* ===== Toast ===== */
function toast(msg, type){
  const root = $("#toastRoot");
  const el = document.createElement("div");
  el.className = "toast show "+(type==="error"?"error":"");
  el.innerHTML = `<span class="t-ic">${type==="error"
    ?`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>`
    :`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`}</span>${escapeHtml(msg)}`;
  root.appendChild(el);
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(),350); }, 2200);
}

/* ===== 主题 ===== */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.settings.theme);
}

/* ===== 转义 ===== */
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ===== AI 助手 ===== */
const aiState = { open:false, history:[] };
function aiOpen(){
  aiState.open = true;
  $("#aiPanel").style.display="flex";
  if(!$("#aiBody").innerHTML.trim()){
    aiAddMsg("bot","你好，我是你的日程助手。我可以在对话框里直接帮你：\n· 添加课程/日程（「周三下午3点加一节高数课」）\n· 查询日程（「今天有什么课」「本周有哪些考试」）\n· 调整课表（「把数据结构调课到周五」）\n· 切换主题（「切换到深色主题」）\n· 查找空闲（「我什么时候有空」）\n\n在「设置」里填上任意大模型 API（豆包 / OpenAI / DeepSeek / Kimi / 通义 / 本地 Ollama 等）后，我还能用真实大模型理解更复杂的指令。");
  }
  $("#aiInput").focus();
}
function aiClose(){ aiState.open=false; $("#aiPanel").style.display="none"; }
function aiAddMsg(role, text, extra){
  const body = $("#aiBody");
  const el = document.createElement("div");
  el.className = "ai-msg "+role;
  el.textContent = text;
  if(extra){ const c=document.createElement("span"); c.className="ai-cmd"; c.textContent=extra; el.appendChild(c); }
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  aiState.history.push({role,text});
}
function aiLoading(){
  const body=$("#aiBody");
  const el=document.createElement("div"); el.className="ai-loading"; el.id="aiLoading";
  el.innerHTML="<i></i><i></i><i></i>";
  body.appendChild(el); body.scrollTop=body.scrollHeight;
}
function aiStopLoading(){
  const l=$("#aiLoading"); if(l) l.remove();
}
async function aiSend(text){
  if(!text) return;
  aiAddMsg("user", text);
  aiLoading();
  const mode = state.settings.apiMode;
  let reply, extra;
  if(mode==="api" && state.settings.aiKey){
    try{
      reply = await aiCallAPI(text);
      extra = "AI 大模型实时回答";
    }catch(e){
      reply = "调用大模型失败："+e.message+"\n已切换为本地智能解析。";
      const local = aiParseLocal(text);
      reply += "\n\n"+local.text;
      extra = local.extra;
    }
  } else {
    const local = aiParseLocal(text);
    reply = local.text; extra = local.extra;
  }
  aiStopLoading();
  setTimeout(()=>aiAddMsg("bot", reply, extra), 200);
}
async function aiCallAPI(userText){
  const s = state.settings;
  const sysPrompt = "你是智能日程管理工具里的 AI 助手。当前工具是面向大学生的课程表+日程管理工具，可管理课程/考试/作业/活动/自定义日程，支持周/日/月视图、倒计时、主题切换、导入导出。请用简洁中文回答用户的日程相关问题，需要操作时直接说明操作步骤即可。";
  const headers = {"Content-Type":"application/json"};
  const auth = s.aiAuth || "bearer";
  if(auth==="bearer") headers["Authorization"]="Bearer "+s.aiKey;
  else if(auth==="api-key") headers["api-key"]=s.aiKey;
  const resp = await fetch(s.aiEndpoint, {
    method:"POST",
    headers,
    body: JSON.stringify({
      model: s.aiModel,
      messages: [{role:"system",content:sysPrompt}, ...aiState.history.slice(-8).map(h=>({role:h.role,content:h.text}))]
    })
  });
  if(!resp.ok){
    const t = await resp.text();
    throw new Error(`HTTP ${resp.status}`);
  }
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || "（没有收到回答）";
}

/* ===== AI 本地解析 ===== */
function aiParseLocal(text){
  const t = text.trim();
  const reply = (s,e)=> ({text:s, extra:e});

  // 主题切换
  if(/切换.*(深色|暗色|夜间|黑色)|换.*(深色|暗色)|开.*(深色|暗色)主题/.test(t)){
    state.settings.theme="dark"; applyTheme(); save();
    return reply("好的，已切换到深色主题。", "已切换深色主题");
  }
  if(/切换.*(浅色|亮色|白天|白色)|换.*(浅色|亮色)/.test(t)){
    state.settings.theme="light"; applyTheme(); save();
    return reply("好的，已切换到浅色主题。", "已切换浅色主题");
  }
  if(/当前.*主题|什么主题/.test(t)){
    return reply(state.settings.theme==="dark"?"当前是深色主题。":"当前是浅色主题。");
  }

  // 查询日程
  if(/今天.*(有|安排|课|日程|什么)/.test(t) || /今天.*(怎么样|咋样)/.test(t) || /今天(的)?(课|安排)/.test(t) || /今天(有)?什么课/.test(t)){
    const wd = (today().getDay()+6)%7;
    const weekIdx = curWeekIndex();
    const blocks = buildBlocks(weekIdx,"all").filter(b=>b.weekday===wd && !b.muted);
    if(!blocks.length) return reply("今天没有安排任何课程或日程，可以好好放松一下。");
    const lines = blocks.map(b=>`· ${b.title}（${b.start}${b.end?"-"+b.end:""}${b.location?" · "+b.location:""}）`).join("\n");
    return reply(`今天（${WEEK_CN[wd]}）的安排如下：\n${lines}`, "已为你列出今日日程");
  }
  if(/明天.*(有|课|安排|日程)/.test(t) || /明天(的)?(课|安排)/.test(t)){
    const d = addDays(today(),1);
    const wd = (d.getDay()+6)%7;
    const weekIdx = weekIndexOf(fmtDate(d));
    const blocks = buildBlocks(weekIdx,"all").filter(b=>b.weekday===wd && !b.muted);
    if(!blocks.length) return reply("明天没有任何安排。");
    const lines = blocks.map(b=>`· ${b.title}（${b.start}${b.end?"-"+b.end:""}${b.location?" · "+b.location:""}）`).join("\n");
    return reply(`明天（${WEEK_CN[wd]} · ${fmtDate(d)}）的安排：\n${lines}`);
  }
  if(/本周.*(考试|安排|课|日程|事件)/.test(t) || /这周(有)?(什么|哪些).*(考试|活动|日程|课)/.test(t)){
    const weekIdx = curWeekIndex();
    const blocks = buildBlocks(weekIdx,"all").filter(b=>!b.muted);
    if(!blocks.length) return reply("本周没有任何安排。");
    const exams = blocks.filter(b=>b.type==="exam");
    const acts = blocks.filter(b=>b.type==="activity"||b.type==="custom");
    let s = `本周（第${weekIdx}周）共 ${blocks.length} 条日程：\n`;
    blocks.slice(0,12).forEach(b=>s+=`· ${WEEK_CN[b.weekday]} ${b.title}（${b.start}${b.end?"-"+b.end:""}）\n`);
    if(blocks.length>12) s+=`…等 ${blocks.length} 条\n`;
    return reply(s);
  }
  if(/考试/.test(t) && /(有哪些|哪些|查|看看|什么)/.test(t)){
    const up = state.events.filter(e=>e.type==="exam"&&e.date&&daysUntil(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
    if(!up.length) return reply("目前没有安排考试。");
    return reply("接下来的考试：\n"+up.map(e=>`· ${e.title}（${e.date}，${daysUntil(e.date)}天后）`).join("\n"));
  }
  if(/作业/.test(t) && /(有哪些|哪些|查|看看|什么|未交|没做)/.test(t)){
    const up = state.events.filter(e=>e.type==="homework"&&e.deadline&&!e.done).sort((a,b)=>a.deadline.localeCompare(b.deadline));
    if(!up.length) return reply("当前没有未完成的作业。");
    return reply("未完成作业：\n"+up.map(e=>`· ${e.title}（截止 ${e.deadline}，${daysUntil(e.deadline)}天后）`).join("\n"));
  }
  if(/空闲/.test(t) || /什么时候有空/.test(t) || /有空时间/.test(t) || /空档/.test(t)){
    const weekIdx = curWeekIndex();
    const free = calcFreeHours(weekIdx);
    // 计算今天空闲
    const wd = (today().getDay()+6)%7;
    const per = state.settings.periods;
    const todayBlocks = buildBlocks(weekIdx,"all").filter(b=>b.weekday===wd&&!b.muted);
    const usedSet = new Set();
    todayBlocks.forEach(b=>{ for(let i=b.startPeriod;i<=b.endPeriod;i++) usedSet.add(i); });
    const freePeriods = per.map((p,i)=>i+1).filter(i=>!usedSet.has(i));
    let s = `本周空闲时间约 ${free} 节（周一至周五）。`;
    if(freePeriods.length) s += `\n今天（${WEEK_CN[wd]}）的空闲节次：${freePeriods.map(i=>`第${i}节`).join("、")}`;
    else s += `\n今天的节次基本排满了。`;
    return reply(s);
  }

  // 调课
  const adjustM = t.match(/(?:把|将)?([\u4e00-\u9fa5A-Za-z0-9]+)(?:调课|调到|改到|挪到|移到)?\s*(?:周)?([一二三四五六日天])?\s*(?:周)?\s*(?:第)?(\d+)?\s*(?:节)?\s*(?:到|至)?(?:周)?([一二三四五六日天])/);
  if(/调课|调到|改到|挪到|移到/.test(t) && adjustM){
    const name = adjustM[1].replace(/(把|将)/,"");
    const wdCn = adjustM[4];
    const wdNum = wdCn?wdCnToNum(wdCn):null;
    const ev = state.events.find(e=>e.title.includes(name)&&e.type==="course");
    if(!ev) return reply(`没有找到名为「${name}」的课程。`);
    if(!wdNum) return reply(`请告诉我调到星期几，例如「把${name}调到周五」。`);
    const slot = ev.slots[0];
    slot.weekday = wdNum;
    save(); render();
    return reply(`好的，已把「${ev.title}」调到${WEEK_CN[wdNum-1]}。`, `已将 ${ev.title} 调课至${WEEK_CN[wdNum-1]}`);
  }

  // 删除
  const delM = t.match(/(?:删除|删掉|取消|移除|去掉)[的]?([\u4e00-\u9fa5A-Za-z0-9]+)/);
  if(delM){
    const name = delM[1];
    const ev = state.events.find(e=>e.title.includes(name));
    if(!ev) return reply(`没有找到「${name}」。`);
    state.events = state.events.filter(e=>e.id!==ev.id);
    save(); render();
    return reply(`好的，已删除「${ev.title}」。`, `已删除 ${ev.title}`);
  }

  // 添加日程
  const addM = t.match(/(?:添加|新增|加|安排|创建)[一个]?(?:周)?([一二三四五六日天])?(?:下午|上午|晚上)?(?:第)?(\d+)?(?:节)?(?:的|一节|一节课|一个)?([\u4e00-\u9fa5A-Za-z0-9]+?)(?:课|课程|考试|作业|活动)?/);
  if(/添加|新增|加|安排|创建/.test(t) && addM){
    const wdCn = addM[1];
    const period = addM[2]?Number(addM[2]):null;
    const name = addM[3];
    const isCourse = /课$|课程/.test(t) || addM[3].length<=6;
    if(wdCn && period && name){
      const wdNum = wdCnToNum(wdCn);
      if(!wdNum){ return reply("我没太听懂是星期几，可以说「周一」到「周日」。"); }
      const weekIdx = curWeekIndex();
      const newEv = {
        id:uid(), type:"course", title:name+"（新课）", color:TYPE_META.course.color, note:"",
        slots:[{weekday:wdNum,startPeriod:period,endPeriod:Math.min(state.settings.periods.length,period+1),startWeek:1,endWeek:state.settings.totalWeeks,parity:"all",location:""}],
        location:"", date:null,startTime:null,endTime:null,deadline:null,dueTime:null,allDay:false,todo:false,done:false
      };
      state.events.push(newEv);
      save(); render();
      return reply(`好的，已添加课程「${name}」：${WEEK_CN[wdNum-1]} 第${period}节，每周。`, `已添加 ${name}（${WEEK_CN[wdNum-1]} 第${period}节）`);
    }
  }

  // 帮助
  if(/帮助|怎么用|能做什么|help/i.test(t)){
    return reply("你可以这样说：\n· 添加课程：「周三下午3点加一节高数课」\n· 查询日程：「今天有什么课」「本周考试」\n· 调课：「把数据结构调到周五」\n· 删除：「删除英语课」\n· 空闲时间：「我什么时候有空」\n· 主题：「切换深色主题」");
  }

  return reply("我还没完全理解这句话。你可以试试这些指令：\n· 「周三下午加一节高数课」\n· 「今天有什么课」\n· 「把数据结构调到周五」\n· 「删除英语课」\n· 「我什么时候有空」\n· 「切换深色主题」\n\n或者在设置里填入豆包 API Key，用真实大模型回答更复杂的问题。");
}
function wdCnToNum(c){
  const map={一:1,二:2,三:3,四:4,五:5,六:6,日:7,天:7};
  return map[c]||null;
}

/* ===== 事件绑定 ===== */
function bindEvents(){
  // 顶部导航
  $$("#mainTabs .tab").forEach(t=>{
    t.onclick = ()=>{ viewState.currentView=t.dataset.nav; render(); };
  });
  // 添加
  $("#addBtn").onclick = ()=>openEventModal(null);
  // 视图切换
  $$("#viewSwitch button").forEach(b=>{
    b.onclick = ()=>{
      viewState.currentView = b.dataset.vw;
      if(b.dataset.vw==="day") viewState.dayDate = fmtDate(today());
      render();
    };
  });
  // 周导航
  $("#prevWeek").onclick = ()=>{
    viewState.weekIdx = Math.max(1, viewState.weekIdx-1); render();
  };
  $("#nextWeek").onclick = ()=>{
    viewState.weekIdx = Math.min(state.settings.totalWeeks, viewState.weekIdx+1); render();
  };
  $("#todayBtn").onclick = ()=>{
    viewState.weekIdx = curWeekIndex();
    viewState.dayDate = fmtDate(today());
    render();
  };
  // 筛选
  $$("#typeFilter .chip").forEach(c=>{
    c.onclick = ()=>{
      viewState.filter = c.dataset.filter; render();
    };
  });
  // 主题
  $("#themeBtn").onclick = ()=>{
    state.settings.theme = state.settings.theme==="dark"?"light":"dark";
    applyTheme(); save(); render(); toast(state.settings.theme==="dark"?"已切换深色主题":"已切换浅色主题");
  };
  // 导入导出
  $("#exportBtn").onclick = exportJSON;
  $("#importBtn").onclick = ()=>$("#importFile").click();
  $("#importFile").addEventListener("change", e=>{
    if(e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value="";
  });
  // AI
  $("#aiFab").onclick = ()=> aiState.open?aiClose():aiOpen();
  $("#aiClose").onclick = aiClose;
  $("#aiSend").onclick = ()=>{ const v=$("#aiInput").value.trim(); if(v){ $("#aiInput").value=""; aiSend(v); } };
  $("#aiInput").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ const v=$("#aiInput").value.trim(); if(v){ $("#aiInput").value=""; aiSend(v); } }
  });
  // 全局关闭弹窗（Esc）
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){
      if($("#evModal")) closeModal();
      if(aiState.open) aiClose();
    }
  });
}

function prefillDate(dateStr){
  openEventModal(null);
  // 打开后填充日期（活动/考试）
  setTimeout(()=>{
    const type = getCurType();
    if(type!=="course"){
      const f = $("#scheduleEditor").querySelector('[data-f="date"]');
      if(f) f.value = dateStr;
    }
  }, 50);
}

/* ===== 初始化 ===== */
function init(){
  applyTheme();
  viewState.weekIdx = curWeekIndex();
  bindEvents();
  render();
}
init();
